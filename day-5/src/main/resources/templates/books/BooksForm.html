<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма книги</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

<!-- Кнопка выхода в шапке -->
<form th:action="@{/logout}" method="post" class="inline">
    <button type="submit" class="text-red-600 hover:text-red-800 font-medium">Выйти</button>
</form>

<div class="max-w-2xl mx-auto">
    <!-- Заголовок -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800"
            th:text="${book.getId() != null ? 'Редактирование книги' : 'Создание новой книги'}">
            Форма книги
        </h1>
        <p class="text-gray-600 mt-1">Заполните данные книги</p>
    </div>

    <!-- Форма -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <form th:action="@{/books/submitForm}" method="post" class="p-6 space-y-6">

            <!-- Скрытое поле ID (для обновления) -->
            <input type="hidden" name="id" th:value="${book.getId()}">

            <!-- Название -->
            <div>
                <label for="bookTitle" class="block text-sm font-medium text-gray-700 mb-2">
                    Название книги
                </label>
                <input type="text" id="bookTitle" name="bookTitle" th:value="${book.getBookTitle()}" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition duration-200"
                       placeholder="Введите название книги">
            </div>

            <!-- Автор -->
            <div>
                <label for="bookAuthor" class="block text-sm font-medium text-gray-700 mb-2">
                    Автор
                </label>
                <input type="text" id="bookAuthor" name="bookAuthor" th:value="${book.getBookAuthor()}" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition duration-200"
                       placeholder="Введите имя автора">
            </div>

            <!-- Кнопки действий -->
            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <!-- Кнопка сохранения -->
                <button type="submit"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span th:text="${book.getId() != null ? 'Сохранить' : 'Создать'}">Сохранить</span>
                </button>

                <!-- Кнопка удаления (только при редактировании) -->
                <button th:if="${book.getId() != null}" type="button"
                        th:onclick="|if(confirm('Вы уверены, что хотите удалить эту книгу?')) { document.getElementById('deleteForm').submit(); }|"
                        class="bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-md transition duration-200 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Удалить
                </button>

                <!-- Кнопка отмены -->
                <a th:href="@{/books}"
                   class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2.5 px-6 rounded-lg shadow-md transition duration-200 flex items-center justify-center">
                    Отмена
                </a>
            </div>

            <!-- Ссылка назад -->
            <div class="text-center pt-4">
                <a th:href="@{/books}" class="text-indigo-600 hover:text-indigo-700 font-medium transition duration-200">
                    ← Вернуться к списку книг
                </a>
            </div>
        </form>

        <!-- Скрытая форма для удаления (отдельная, чтобы не конфликтовать с основной) -->
        <form id="deleteForm" th:action="@{/books/delete/{id}(id=${book.getId()})}" method="post" style="display: none;"></form>
    </div>
</div>

</body>
</html>
