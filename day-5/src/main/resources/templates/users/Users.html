<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<!-- Кнопка выхода в шапке -->
<form th:action="@{/logout}" method="post" class="inline">
    <button type="submit" class="text-red-600 hover:text-red-800 font-medium">Выйти</button>
</form>

<div class="max-w-5xl mx-auto">
    <div>
        <a th:href="@{/books}">Книги</a>
        <a th:href="@{/users}">Авторы</a>
    </div>
    <!-- Заголовок и кнопка -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Список пользователей</h1>
        <a th:href="@{/users/new}">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow-md transition duration-200 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Создать пользователя
            </button>
        </a>
    </div>

    <!-- Таблица в карточке -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Имя</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Действия</th>
            </tr>
            </thead>

            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="user : ${users}" class="hover:bg-gray-50 transition duration-150">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    <span th:text="${user.getId()}"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                    <span th:text="${user.getUserName()}"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                    <span th:text="${user.getUserEmail()}"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <a th:href="@{/users/edit/{id}(id=${user.getId()})}"
                       class="inline-flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-1.5 px-3 rounded-lg transition duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        Редактировать
                    </a>
                </td>
            </tr>
            <!-- Сообщение при отсутствии пользователей -->
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="px-6 py-8 text-center text-gray-400">
                    Пользователей пока нет. Создайте первого!
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
